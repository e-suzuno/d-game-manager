name: Build Windows

on:
  workflow_dispatch: # 手動実行
  push:
    tags:
      - 'v*' # v0.1.0 などのタグ push でリリースビルド

jobs:
  build:
    runs-on: windows-latest
    # タグ push 時に Release を作るため書き込みが必要（それ以外の権限は与えない）。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      # go:embed all:frontend/dist が解決できるよう、テスト前にフロントをビルドして dist を生成する
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Run Go tests
        run: go test ./...

      - name: Build (exe + NSIS installer)
        run: wails build -platform windows/amd64 -nsis

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: d-game-manager-windows
          path: |
            build/bin/d-game-manager.exe
            build/bin/d-game-manager-amd64-installer.exe

      - name: Create release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          # インストーラーは LICENSE / THIRD_PARTY_NOTICES.md をインストール先に展開するが、
          # 単体の .exe を直接ダウンロードする経路にはそれがない。同梱している第三者
          # ソフトウェアのライセンス表示が配布物に必ず伴うよう、リリース資材にも添付する。
          files: |
            build/bin/d-game-manager.exe
            build/bin/d-game-manager-amd64-installer.exe
            LICENSE
            THIRD_PARTY_NOTICES.md
